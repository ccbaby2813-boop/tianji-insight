<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天机推演 · 管理后台</title>
  <link rel="stylesheet" href="/tianji/lib/element-plus.css">
  <script src="/tianji/lib/vue.global.prod.js"></script>
  <script src="/tianji/lib/element-plus.full.js"></script>
  <script src="/tianji/lib/element-plus-icons.js"></script>
  <script src="/tianji/lib/axios.min.js"></script>
  <script src="/tianji/lib/echarts.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; }
    /* Login */
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .login-card { width: 400px; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-card h1 { text-align: center; margin-bottom: 8px; color: #303133; font-size: 24px; }
    .login-card p { text-align: center; color: #909399; margin-bottom: 30px; }
    /* Layout */
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #001529; color: #fff; position: fixed; top: 0; left: 0; bottom: 0; overflow-y: auto; z-index: 100; transition: width 0.28s ease; }
    .sidebar.collapsed { width: 64px; }
    .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); overflow: hidden; white-space: nowrap; }
    .sidebar-header h2 { color: #fff; font-size: 18px; margin: 0; }
    .sidebar-header p { color: rgba(255,255,255,0.5); font-size: 12px; margin-top: 4px; }
    .sidebar.collapsed .sidebar-header h2 { font-size: 0; }
    .sidebar.collapsed .sidebar-header p { font-size: 0; margin-top: 0; }
    .sidebar.collapsed .sidebar-header { padding: 16px 0; }
    .sidebar.collapsed .sidebar-header::after { content: '🔮'; font-size: 24px; display: block; }
    .sidebar .el-menu { border-right: none; background: #001529; }
    .sidebar .el-menu-item, .sidebar .el-sub-menu__title { color: rgba(255,255,255,0.7); }
    .sidebar .el-menu-item:hover, .sidebar .el-sub-menu__title:hover { color: #fff; background: rgba(255,255,255,0.05); }
    .sidebar .el-menu-item.is-active { color: #fff; background: #1890ff; }
    .sidebar .el-sub-menu .el-menu { background: #000c17; }
    .sidebar .el-sub-menu .el-menu-item { padding-left: 54px !important; font-size: 13px; }
    /* Collapsed sidebar menu overrides */
    .sidebar.collapsed .el-menu-item span,
    .sidebar.collapsed .el-sub-menu__title span { display: none; }
    .sidebar.collapsed .el-sub-menu .el-menu { display: none; }
    .sidebar.collapsed .el-sub-menu__icon-arrow { display: none; }
    .sidebar.collapsed .el-menu-item .el-icon,
    .sidebar.collapsed .el-sub-menu__title .el-icon { margin-right: 0; }
    .main-content { margin-left: 240px; flex: 1; min-height: 100vh; transition: margin-left 0.28s ease; }
    .main-content.expanded { margin-left: 64px; }
    .header-bar { height: 56px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); position: sticky; top: 0; z-index: 99; }
    .header-bar .breadcrumb { font-size: 16px; font-weight: 500; color: #303133; }
    .hamburger-btn { cursor: pointer; font-size: 20px; color: #606266; padding: 6px; border-radius: 4px; transition: background 0.2s; }
    .hamburger-btn:hover { background: #f5f7fa; }
    .page-content { padding: 20px; }
    /* Cards */
    .stat-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat-card .label { font-size: 13px; color: #909399; margin-bottom: 8px; }
    .stat-card .value { font-size: 28px; font-weight: 600; color: #303133; }
    .stat-card .extra { font-size: 12px; color: #67c23a; margin-top: 4px; }
    .stat-card .extra.down { color: #f56c6c; }
    .chart-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; }
    .chart-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .chart-card h3 { font-size: 15px; color: #303133; margin-bottom: 16px; }
    .chart-full { width: 100%; }
    .stat-card .extra { font-size: 12px; color: #909399; margin-top: 4px; }
    .report-detail-dialog .el-message-box__message { white-space: pre-wrap; font-family: monospace; font-size: 13px; }
    .chart-container { height: 300px; }
    .chart-full { grid-column: 1 / -1; }
    /* Alert banner */
    .alert-banner { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .alert-banner .alert-title { font-weight: 500; color: #e6a23c; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
    .alert-banner .alert-item { font-size: 13px; color: #606266; padding: 4px 0; }
    /* Tables */
    .table-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
    .table-card h3 { font-size: 15px; color: #303133; margin-bottom: 16px; }
    .table-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
    .table-toolbar .filters { display: flex; gap: 10px; flex-wrap: wrap; }
    /* Retention */
    .retention-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 20px; }
    .retention-item { background: #fff; border-radius: 8px; padding: 20px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .retention-item .day { font-size: 14px; color: #909399; margin-bottom: 8px; }
    .retention-item .rate { font-size: 32px; font-weight: 700; color: #409eff; }
    .retention-item .detail { font-size: 12px; color: #909399; margin-top: 4px; }
    /* Heatmap */
    .heatmap-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
    .heatmap-cell { aspect-ratio: 1; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; cursor: default; }
    /* User type filter buttons */
    .user-type-filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .user-type-filters .filter-btn { cursor: pointer; }
    /* Skeleton loading */
    .skeleton-card { background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .skeleton-row { display: flex; gap: 16px; margin-bottom: 12px; align-items: center; }
    .skeleton-row .skeleton-label { width: 80px; height: 14px; background: #f0f2f5; border-radius: 4px; animation: skeleton-pulse 1.5s infinite; }
    .skeleton-row .skeleton-value { width: 120px; height: 28px; background: #f0f2f5; border-radius: 4px; animation: skeleton-pulse 1.5s infinite; }
    .skeleton-row .skeleton-extra { width: 100px; height: 12px; background: #f0f2f5; border-radius: 4px; animation: skeleton-pulse 1.5s infinite; }
    @keyframes skeleton-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
    /* Responsive */
    @media (max-width: 1200px) { .chart-row { grid-template-columns: 1fr; } }
    @media (max-width: 768px) { .stat-cards { grid-template-columns: repeat(2, 1fr); } .retention-grid { grid-template-columns: 1fr; } }
    /* Unread badge */
    .unread-badge { margin-left: 4px; }
    /* 虚拟用户列表未读行高亮 */
    .el-table .warning-row { background: #fef0f0 !important; }
    .el-table .warning-row:hover > td { background: #fde2e2 !important; }
    /* Letter list in thread detail */
    .letter-list { max-height: 480px; overflow-y: auto; padding: 8px 4px; }
    .letter-item { display: flex; margin-bottom: 16px; }
    .letter-item.letter-sent { justify-content: flex-end; }
    .letter-bubble { max-width: 72%; padding: 12px 16px; border-radius: 12px; word-break: break-word; }
    .letter-received .letter-bubble { background: #f5f7fa; border-bottom-left-radius: 4px; }
    .letter-sent .letter-bubble { background: #ecf5ff; border-bottom-right-radius: 4px; }
    .letter-content { font-size: 14px; line-height: 1.6; color: #303133; white-space: pre-wrap; }
    .letter-time { font-size: 11px; color: #909399; margin-top: 6px; }
    .letter-load-more { text-align: center; padding: 12px 0; color: #909399; font-size: 13px; }
  </style>
</head>
<body>
<div id="app"></div>
<script type="text/template" id="app-template">
  <!-- Login -->
  <div v-if="!token" class="login-container">
    <div class="login-card">
      <h1>🔮 天机推演</h1>
      <p>管理后台</p>
      <el-form :model="loginForm" @submit.prevent="handleLogin">
        <el-form-item>
          <el-input v-model="loginForm.username" placeholder="用户名" prefix-icon="User" size="large"></el-input>
        </el-form-item>
        <el-form-item>
          <el-input v-model="loginForm.password" type="password" placeholder="密码" prefix-icon="Lock" size="large" show-password></el-input>
        </el-form-item>
        <el-form-item>
          <el-button type="primary" size="large" style="width:100%" @click="handleLogin" :loading="loginLoading">登 录</el-button>
        </el-form-item>
      </el-form>
    </div>
  </div>

  <!-- Main Layout -->
  <div v-else class="admin-layout">
    <!-- Sidebar -->
    <div class="sidebar" :class="{ collapsed: sidebarCollapsed }">
      <div class="sidebar-header">
        <h2>🔮 天机推演</h2>
        <p>管理后台 v2.0</p>
      </div>
      <el-menu :default-active="activeMenu" @select="handleMenuSelect" background-color="#001529" text-color="rgba(255,255,255,0.7)" active-text-color="#fff">
        <el-menu-item index="overview">
          <el-icon><component is="DataAnalysis"/></el-icon>
          <span>总览</span>
        </el-menu-item>
        <el-sub-menu index="user-ops">
          <template #title>
            <el-icon><component is="User"/></el-icon>
            <span>用户运营</span>
          </template>
          <el-menu-item index="users">用户列表</el-menu-item>
          <el-menu-item index="vip">VIP管理</el-menu-item>
          <el-menu-item index="user-profile">用户画像</el-menu-item>
          <el-menu-item index="deletions">删除合规</el-menu-item>
        </el-sub-menu>
        <el-sub-menu index="analytics">
          <template #title>
            <el-icon><component is="TrendCharts"/></el-icon>
            <span>数据分析</span>
          </template>
          <el-menu-item index="funnel">转化漏斗</el-menu-item>
          <el-menu-item index="tuiyan-analysis">推演分析</el-menu-item>
          <el-menu-item index="match-analysis">匹配分析</el-menu-item>
          <el-menu-item index="share-analysis">分享分析</el-menu-item>
          <el-menu-item index="revenue-analysis">收入分析</el-menu-item>
          <el-menu-item index="retention">留存分析</el-menu-item>
        </el-sub-menu>
        <el-sub-menu index="letter">
          <template #title>
            <el-icon><component is="Message"/></el-icon>
            <span>易缘传书</span>
          </template>
          <el-menu-item index="letter-overview">数据概览</el-menu-item>
          <el-menu-item index="letter-analysis">分析统计</el-menu-item>
          <el-menu-item index="letter-history">信件历史</el-menu-item>
          <el-menu-item index="virtual-users">虚拟用户管理</el-menu-item>
          <el-menu-item index="letter-reports">举报管理</el-menu-item>
        </el-sub-menu>
        <el-sub-menu index="content">
          <template #title>
            <el-icon><component is="Files"/></el-icon>
            <span>内容资产</span>
          </template>
          <el-menu-item index="ai-quality">AI质量监控</el-menu-item>
          <el-menu-item index="hexagrams">卦象管理</el-menu-item>
          <el-menu-item index="match-corpus">匹配语料</el-menu-item>
          <el-menu-item index="achievements">成就管理</el-menu-item>
          <el-menu-item index="solar-term">节气养生</el-menu-item>
          <el-menu-item index="app-download">App下载版本</el-menu-item>
        </el-sub-menu>
        <el-sub-menu index="system">
          <template #title>
            <el-icon><component is="Setting"/></el-icon>
            <span>系统管理</span>
          </template>
          <el-menu-item index="settings">系统设置</el-menu-item>
          <el-menu-item index="logs">操作日志</el-menu-item>
          <el-menu-item index="health">系统健康</el-menu-item>
        </el-sub-menu>
      </el-menu>
    </div>

    <!-- Main -->
    <div class="main-content" :class="{ expanded: sidebarCollapsed }">
      <div class="header-bar">
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="hamburger-btn" @click="sidebarCollapsed = !sidebarCollapsed">
            <el-icon><component :is="sidebarCollapsed ? 'Expand' : 'Fold'"/></el-icon>
          </span>
          <span class="breadcrumb">{{ pageTitle }}</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <el-tag size="small" type="info">{{ adminUser }}</el-tag>
          <el-button size="small" @click="handleLogout">退出</el-button>
        </div>
      </div>
      <div class="page-content">
        <!-- ==================== OVERVIEW ==================== -->
        <div v-if="activeMenu==='overview'">
          <!-- Alerts -->
          <div v-if="alerts.length" class="alert-banner">
            <div class="alert-title"><el-icon><component is="WarningFilled"/></el-icon> 异常告警</div>
            <div v-for="a in alerts" :key="a" class="alert-item">⚠️ {{ a }}</div>
          </div>
          <!-- Skeleton Loading -->
          <template v-if="overviewLoading">
            <div class="stat-cards">
              <div class="skeleton-card" v-for="i in 8" :key="i">
                <div class="skeleton-row"><div class="skeleton-label"></div></div>
                <div class="skeleton-row"><div class="skeleton-value"></div></div>
                <div class="skeleton-row"><div class="skeleton-extra"></div></div>
              </div>
            </div>
            <div class="chart-row">
              <div class="skeleton-card" style="height:340px"></div>
              <div class="skeleton-card" style="height:340px"></div>
            </div>
          </template>
          <!-- Stat Cards -->
          <template v-else>
            <div class="stat-cards">
              <div class="stat-card">
                <div class="label">总用户数</div>
                <div class="value">{{ overview.totalUsers?.toLocaleString() || 0 }}</div>
                <div class="extra">本月 +{{ kpi.thisMonth?.newUsers || 0 }}</div>
              </div>
              <div class="stat-card">
                <div class="label">今日新增</div>
                <div class="value">{{ dashboardAggregate.todayNewUsers?.toLocaleString() || 0 }}</div>
                <div class="extra" :class="dashboardAggregate.todayNewUsers > 0 ? '' : 'down'">{{ dashboardAggregate.todayNewUsers || 0 }} 人</div>
              </div>
              <div class="stat-card">
                <div class="label">今日活跃</div>
                <div class="value">{{ dashboardAggregate.todayActiveUsers?.toLocaleString() || 0 }}</div>
                <div class="extra">DAU</div>
              </div>
              <div class="stat-card">
                <div class="label">今日推演</div>
                <div class="value">{{ dashboardAggregate.todayTuiyan?.toLocaleString() || 0 }}</div>
                <div class="extra">今日推演次数</div>
              </div>
              <div class="stat-card">
                <div class="label">今日匹配</div>
                <div class="value">{{ dashboardAggregate.todayMatches?.toLocaleString() || 0 }}</div>
                <div class="extra">今日匹配次数</div>
              </div>
              <div class="stat-card">
                <div class="label">VIP总数</div>
                <div class="value">{{ dashboardAggregate.totalVip?.toLocaleString() || 0 }}</div>
                <div class="extra">付费用户</div>
              </div>
              <div class="stat-card">
                <div class="label">待删除</div>
                <div class="value" :style="{color: (dashboardAggregate.pendingDeletions || 0) > 0 ? '#f56c6c' : '#67c23a'}">{{ dashboardAggregate.pendingDeletions?.toLocaleString() || 0 }}</div>
                <div class="extra">GDPR待处理</div>
              </div>
              <div class="stat-card">
                <div class="label">今日收入</div>
                <div class="value" style="color:#67c23a">¥{{ dashboardAggregate.todayRevenue?.toLocaleString() || 0 }}</div>
                <div class="extra">本月 ¥{{ kpi.thisMonth?.revenue || 0 }}</div>
              </div>
            </div>
          </template>
          <!-- Charts Row 1 -->
          <div class="chart-row">
            <div class="chart-card">
              <h3>用户增长趋势 (近7天)</h3>
              <div class="chart-container" ref="chartUserTrend" style="width:100%;height:300px"></div>
            </div>
            <div class="chart-card">
              <h3>推演趋势 (近7天)</h3>
              <div class="chart-container" ref="chartTuiyanTrend" style="width:100%;height:300px"></div>
            </div>
          </div>
          <!-- Charts Row 2 -->
          <div class="chart-row">
            <div class="chart-card">
              <h3>套餐分布</h3>
              <div class="chart-container" ref="chartPlanDist" style="width:100%;height:300px"></div>
            </div>
            <div class="chart-card">
              <h3>24小时活跃热力 (近7天)</h3>
              <div class="chart-container" ref="chartHourly" style="width:100%;height:300px"></div>
            </div>
          </div>
          <!-- v15.14 城市分布 -->
          <div class="chart-row">
            <div class="chart-card chart-full">
              <h3>城市分布 TOP10</h3>
              <div class="chart-container" ref="chartRegionDist" style="width:100%;height:300px"></div>
            </div>
          </div>
          <!-- Retention (精简为跳转入口，详细数据在留存分析页查看) -->
          <div class="table-card" style="display:flex;align-items:center;gap:16px;">
            <div>
              <span style="color:#909399;font-size:13px;">活跃用户：</span>
              <strong style="color:#409eff;margin:0 4px;">DAU {{ retention.dau?.count || 0 }}</strong>
              <span style="color:#909399;">/</span>
              <strong style="color:#409eff;margin:0 4px;">WAU {{ retention.wau?.count || 0 }}</strong>
              <span style="color:#909399;">/</span>
              <strong style="color:#409eff;margin:0 4px;">MAU {{ retention.mau?.count || 0 }}</strong>
            </div>
            <el-button type="primary" link @click="handleMenuSelect('retention')">查看详情 →</el-button>
          </div>
          <!-- Recent Activity -->
          <div class="table-card">
            <h3>最近动态</h3>
            <el-table :data="recentActivity.users || []" stripe size="small" max-height="300">
              <el-table-column prop="nickname" label="用户" width="150"></el-table-column>
              <el-table-column prop="plan_type" label="套餐" width="100"></el-table-column>
              <el-table-column prop="created_at" label="注册时间" width="180">
                <template #default="{row}">{{ formatTime(row.created_at) }}</template>
              </el-table-column>
            </el-table>
          </div>
          <!-- 使用次数排行 -->
          <div class="table-card">
            <h3>使用次数排行 TOP10</h3>
            <el-table :data="topActiveUsers" stripe size="small" v-loading="topActiveLoading">
              <el-table-column label="排名" width="70">
                <template #default="{row}">{{ row._rank }}</template>
              </el-table-column>
              <el-table-column prop="nickname" label="昵称" width="150"></el-table-column>
              <el-table-column prop="tuiyan_count" label="推演次数" width="100"></el-table-column>
              <el-table-column prop="match_count" label="匹配次数" width="100"></el-table-column>
              <el-table-column label="总使用次数">
                <template #default="{row}">{{ (row.tuiyan_count || 0) + (row.match_count || 0) }}</template>
              </el-table-column>
            </el-table>
          </div>
        </div>

        <!-- ==================== USERS ==================== -->
        <div v-if="activeMenu==='users'">
          <div class="stat-cards">
            <div class="stat-card"><div class="label">总用户</div><div class="value">{{ userStats.total || 0 }}</div></div>
            <div class="stat-card"><div class="label">已建档</div><div class="value">{{ userStats.withProfile || 0 }}</div></div>
            <div class="stat-card"><div class="label">免费用户</div><div class="value">{{ userStats.free || 0 }}</div></div>
            <div class="stat-card"><div class="label">月费用户</div><div class="value">{{ userStats.monthly || 0 }}</div></div>
            <div class="stat-card"><div class="label">年费用户</div><div class="value">{{ userStats.yearly || 0 }}</div></div>
            <div class="stat-card"><div class="label">已过期</div><div class="value">{{ userStats.expired || 0 }}</div></div>
          </div>
          <div class="table-card">
            <div class="table-toolbar">
              <div class="filters">
                <el-input v-model="userSearch" placeholder="搜索昵称/OpenID" style="width:220px" clearable @clear="handleUserSearchClear" @keyup.enter="handleUserSearch"></el-input>
                <el-select v-model="userPlanFilter" placeholder="套餐筛选" clearable style="width:140px" @change="handleUserFilterChange">
                  <el-option label="免费" value="free"></el-option>
                  <el-option label="月费" value="monthly"></el-option>
                  <el-option label="年费" value="yearly"></el-option>
                </el-select>
                <!-- 用户类型筛选 -->
                <div class="user-type-filters">
                  <el-radio-group v-model="userTypeFilter" size="small" @change="handleUserFilterChange">
                    <el-radio-button label="">全部</el-radio-button>
                    <el-radio-button label="vip">VIP</el-radio-button>
                    <el-radio-button label="free">免费</el-radio-button>
                    <el-radio-button label="profiled">已建档</el-radio-button>
                    <el-radio-button label="guest">游客</el-radio-button>
                  </el-radio-group>
                </div>
                <el-button type="primary" @click="handleUserSearch">搜索</el-button>
                <!-- 导出CSV按钮 -->
                <el-button type="success" @click="exportUsersCSV" :loading="userExportLoading">

        // 排除登录接口（登录失败由 handleLogin 处理，不清除 token）

    const threadCurrentFriendOpenid = ref('');
    const threadDetailTitle = computed(() => {
      if (!threadFriendInfo.value) return '对话详情';
      return `与 ${threadFriendInfo.value.nickname || '对方'} 的往来信件`;
    });

    // Chart refs
    const chartUserTrend = ref(null);
    const chartTuiyanTrend = ref(null);
    const chartGuaDist = ref(null);
    const chartPlanDist = ref(null);
    const chartHourly = ref(null);
    const chartRegionDist = ref(null); // v15.14 城市分布
    const chartFunnel = ref(null);
    const chartLetterPoolTrend = ref(null);
    const chartLetterPoolGua = ref(null);
    const chartTuiyanTrend30 = ref(null);
    const chartQuestionType = ref(null);
    const chartMatchScore = ref(null);
    const chartMatchRel = ref(null);
    const chartMatchTrend = ref(null);
    const chartShareType = ref(null);
    const chartShareFunnel = ref(null);
    const chartRevenueTrend = ref(null);
    const chartProductAnalysis = ref(null);
    const chartOrderStatus = ref(null);
    const chartDauTrend = ref(null);
    const chartAiTrend = ref(null);
    // v2.1 新增图表
    const chartReportReason = ref(null);
    const chartLetterFunnel = ref(null);
    const chartLetterTrend = ref(null);
    const chartLetterLength = ref(null);
    const chartLetterHourly = ref(null);

    const chartInstances = {};

    // Computed
    const pageTitle = computed(() => {
      const map = {
        overview: '总览', users: '用户列表', vip: 'VIP管理', 'user-profile': '用户画像',
        deletions: '删除合规',
        funnel: '转化漏斗', 'tuiyan-analysis': '推演分析', 'match-analysis': '匹配分析',
        'share-analysis': '分享分析', 'revenue-analysis': '收入分析', retention: '留存分析',
        'ai-quality': 'AI质量监控', hexagrams: '卦象管理', 'match-corpus': '匹配语料',
        achievements: '成就管理', 'app-download': 'App下载版本', settings: '系统设置', logs: '操作日志', health: '系统健康',
        'letter-pool': '易缘传书 · 匹配池概览', 'letter-stats': '易缘传书 · 数据统计',
        'letter-funnel': '易缘传书 · 转化漏斗', 'letter-analysis': '易缘传书 · 信件分析',
        'letter-history': '易缘传书 · 信件历史',
        'virtual-users': '易缘传书 · 虚拟用户管理', 'letter-reports': '易缘传书 · 举报管理'
      };
      return map[activeMenu.value] || '总览';
    });

    // Methods
    function formatTime(t) {
      if (!t) return '-';
      return new Date(t).toLocaleString('zh-CN', { hour12: false });
    }

    function stepLabel(step) {
      const map = { app_open: '打开应用', page_view: '页面浏览', profile_create: '创建档案', tuiyan: '推演', match: '匹配', share: '分享', vip_purchase: 'VIP购买' };
      return map[step] || step;
    }

    // 解析留存率数值，用于颜色标识
    function parseRate(rate) {
      const n = parseFloat(rate);
      return isNaN(n) ? 0 : n;
    }
    function retentionRateColor(rate) {
      const n = parseRate(rate);
      if (n > 30) return '#67c23a';      // 绿色
      if (n >= 10) return '#e6a23c';     // 橙色
      return '#f56c6c';                  // 红色
    }

    async function handleLogin() {
      loginLoading.value = true;
      try {
        const res = await api.post('/login', loginForm);
        if (res.data.success) {
          token.value = res.data.data.token;
          adminUser.value = loginForm.username;
          localStorage.setItem('admin_token', token.value);
          localStorage.setItem('admin_user', loginForm.username);
          loadOverview();
        }
      } catch (e) {
        ElementPlus.ElMessage.error(e.response?.data?.message || '登录失败');
      }
      loginLoading.value = false;
    }

    function handleLogout() {
      token.value = '';
      localStorage.removeItem('admin_token');
      localStorage.removeItem('admin_user');
    }

    function handleMenuSelect(index) {
      activeMenu.value = index;
      nextTick(() => loadPageData(index));
    }

    async function loadPageData(page) {
      switch (page) {
        case 'overview': await loadOverview(); break;
        case 'users': await loadUserStats(); await loadUsers(); break;
        case 'vip': await loadOrders(); break;
        case 'user-profile': await loadUserProfile(); break;
        case 'deletions': await loadDeletions(); break;
        case 'funnel': if (funnelType.value === 'letter') { await loadLetterFunnel(); } else { await loadFunnel(); } break;
        case 'tuiyan-analysis': await loadTuiyanAnalysis(); break;
        case 'match-analysis': await loadMatchAnalysis(); break;
        case 'share-analysis': await loadShareAnalysis(); break;
        case 'revenue-analysis': await loadRevenueAnalysis(); break;
        case 'retention': await loadRetentionPage(); await loadRetentionCohort(); break;
        case 'ai-quality': await loadAiQuality(); break;
        case 'hexagrams': await loadHexagrams(); break;
        case 'match-corpus': await loadCorpus(); break;
        case 'achievements': await loadAchievements(); break;
        case 'settings': await loadSettings(); break;
        case 'logs': await loadLogs(); break;
        case 'health': await checkHealth(); break;
        // 易缘传书 (v1.4 菜单：数据概览/分析统计/信件历史/虚拟用户管理/举报管理)
        case 'letter-overview': await loadLetterStats(); break;
        case 'letter-analysis': await loadLetterFunnel(); await loadLetterAnalysis(); break;
        case 'letter-history': await loadLetterHistory(); break;
        case 'virtual-users': await loadReplyConfig(); await loadVirtualUsers(1); break;
        case 'letter-reports': await loadLetterReports(1); await loadReportStats(); await loadReportRanking(); break;
        // 节气养生 (v2.2)
        case 'solar-term': await loadSolarTermStats(); await loadAdvices(1); break;
        case 'app-download': await loadAppDownload(); break;
      }
    }

    // Overview - with aggregate API
    async function loadOverview() {
      overviewLoading.value = true;
      try {
        // Try aggregate API first, fall back to parallel calls
        const aggRes = await api.get('/dashboard/aggregate');
        const aggData = aggRes.data.data || {};
        dashboardAggregate.value = aggData;
        overview.value = {
          totalUsers: aggData.totalUsers || 0,
          todayNewUsers: aggData.todayNewUsers || 0,
          todayActiveUsers: aggData.todayActiveUsers || 0,
          todayTuiyan: aggData.todayTuiyan || 0,
          todayMatches: aggData.todayMatches || 0,
          totalVip: aggData.totalVip || 0,
          pendingDeletions: aggData.pendingDeletions || 0,
          revenueToday: aggData.todayRevenue || 0
        };
        kpi.value = aggData.kpi || { thisMonth: {}, lastMonth: {} };
        retention.value = aggData.retention || {};
        orderStats.value = aggData.orderStats || {};
        matchStats.value = aggData.matchStats || {};
        shareStats.value = aggData.shareStats || {};
        userStats.value = aggData.userStats || {};
        recentActivity.value = aggData.recentActivity || {};
        // 并行补充 aggregate 未返回的数据（kpi/留存/订单/匹配/分享/用户/近期活动）
        if (!aggData.kpi || !aggData.retention || !aggData.orderStats) {
          try {
            const [kp, ret, os, ms, ss, us, ra] = await Promise.all([
              api.get('/dashboard/kpi-comparison').catch(() => ({ data: { data: {} } })),
              api.get('/dashboard/retention').catch(() => ({ data: { data: {} } })),
              api.get('/orders/stats').catch(() => ({ data: { data: {} } })),
              api.get('/matches/stats').catch(() => ({ data: { data: {} } })),
              api.get('/shares/stats').catch(() => ({ data: { data: {} } })),
              api.get('/users/stats').catch(() => ({ data: { data: {} } })),
              api.get('/dashboard/recent-activity?limit=10').catch(() => ({ data: { data: {} } }))
            ]);
            if (!aggData.kpi) kpi.value = kp.data.data || {};
            if (!aggData.retention) retention.value = ret.data.data || {};
            if (!aggData.orderStats) orderStats.value = os.data.data || {};
            if (!aggData.matchStats) matchStats.value = ms.data.data || {};
            if (!aggData.shareStats) shareStats.value = ss.data.data || {};
            if (!aggData.userStats) userStats.value = us.data.data || {};
            if (!aggData.recentActivity) recentActivity.value = ra.data.data || {};
          } catch (e) { console.warn('Supplementary data load failed:', e); }
        }
        // Check alerts
        alerts.value = [];
        if (retention.value.d1?.rate < 20) alerts.value.push('D1留存率低于20%，需关注');
        if (orderStats.value.pending > 10) alerts.value.push(`${orderStats.value.pending}个待处理订单`);
        // Load charts
        await Vue.nextTick();
        setTimeout(async () => {
          try {
            const containers = document.querySelectorAll('.chart-container');
            const safeInitChart = (container, option) => {
              if (!container || container.offsetWidth === 0 || container.offsetHeight === 0) {
                console.warn('Chart container not ready, skipping');
                return null;
              }
              try {
                const chart = echarts.init(container);
                chart.setOption(option);
                return chart;
              } catch (e) {
                console.error('Chart init error:', e);
                return null;
              }
            };
            // User trend (container 0)
            const userTrendRes = await api.get('/dashboard/trends?type=users&days=7');
            const userTrendData = userTrendRes.data.data || [];
            safeInitChart(containers[0], {
              grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
              tooltip: { trigger: 'axis' },
              xAxis: { type: 'category', data: userTrendData.map(d => d.date?.slice(5)) },
              yAxis: { type: 'value' },
              series: [{ data: userTrendData.map(d => d.cnt), type: 'line', smooth: true, areaStyle: { opacity: 0.3 }, itemStyle: { color: '#409eff' } }]
            });
            // Tuiyan trend (container 1)
            const tuiyanRes = await api.get('/dashboard/trends?type=tuiyan&days=7');
            const tuiyanData = tuiyanRes.data.data || [];
            safeInitChart(containers[1], {
              grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
              tooltip: { trigger: 'axis' },
              xAxis: { type: 'category', data: tuiyanData.map(d => d.date?.slice(5)) },
              yAxis: { type: 'value' },
              series: [{ data: tuiyanData.map(d => d.cnt), type: 'line', smooth: true, areaStyle: { opacity: 0.3 }, itemStyle: { color: '#67c23a' } }]
            });
            // Hourly activity (container 3)
            const hourlyRes = await api.get('/dashboard/hourly-activity');
            const hourlyData = hourlyRes.data.data || [];
            const hours = Array.from({ length: 24 }, (_, i) => i);
            const values = hours.map(h => { const found = hourlyData.find(d => d.hour == h); return found ? found.cnt : 0; });

        // Format uptime from seconds to human-readable

        const hours = Math.floor((uptimeSec % 86400) / 3600);
        const mins = Math.floor((uptimeSec % 3600) / 60);
        healthStatus.uptime = days > 0 ? `${days}天${hours}小时${mins}分` : hours > 0 ? `${hours}小时${mins}分` : `${mins}分`;

    // Chart rendering helper
    function renderChart(key, el, option) {
      if (!el) return;
      if (chartInstances[key]) chartInstances[key].dispose();
      const chart = echarts.init(el);
      const baseOption = {
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        tooltip: { trigger: 'axis', ...option.tooltip },
        ...option
      };
      if (option.series?.[0]?.type === 'pie' || option.series?.[0]?.type === 'funnel') {
        baseOption.tooltip = { trigger: 'item', ...option.tooltip };
      }
      chart.setOption(baseOption);
      chartInstances[key] = chart;
    }

      // 标记已读
      if (row.unread_count > 0) {
        try {
          await api.put(`/virtual-users/${threadsDialogUser.value.openid}/thread/${row.other_openid}/read`);
          // 更新对话列表中的未读数
          const idx = threadList.list.findIndex(t => t.other_openid === row.other_openid);
          if (idx >= 0) threadList.list[idx].unread_count = 0;
          if (threadList.totalUnread > 0) threadList.totalUnread = Math.max(0, threadList.totalUnread - row.unread_count);
          // 同步更新虚拟用户列表中的未读数（关键：让外层列表角标消失）
          const vIdx = virtualUsers.list.findIndex(u => u.openid === threadsDialogUser.value.openid);
          if (vIdx >= 0) {
            const u = virtualUsers.list[vIdx];
            const before = u.unread_letter_count || 0;
            const after = Math.max(0, before - row.unread_count);
            u.unread_letter_count = after;
            if (after === 0 && u.received_letter_count !== undefined) {
              // 没有未读了，行不高亮，但收信数保留
            }
            // 更新总未读数
            if (virtualUsers.totalUnread > 0) {
              virtualUsers.totalUnread = Math.max(0, virtualUsers.totalUnread - (before - after));
            }
          }
        } catch (e) { /* ignore */ }
      }
    }

          ElementPlus.ElMessage.success(res.data.data.message);
          loadAdvices();
          loadSolarTermStats();
        }
      } catch (e) {
        ElementPlus.ElMessage.error('更新状态失败: ' + (e.response?.data?.message || e.message));
      }
    }

    async function viewAdviceDetail(id) {
      try {
        const res = await api.get(`/solar-term/advices/${id}`);
        if (res.data.success) {
          const d = res.data.data;
          const lines = [
            `节气：${termIndexToName(d.solar_term_index)}（${d.term_wuxing}）`,
            `卦格：${d.gua_ge}（${d.gua_wuxing}）`,
            `五行关系：${d.element_interaction || '-'}（${d.relation_type || '-'}）`,
            `对应脏腑：${d.corresponding_organ || '-'}`,
            ``,
            `【脏腑警示】`,
            d.warning || '-',
            ``,
            `【推荐食物】 ${(d.recommend_food || []).join('、')}`,
            `【推荐活动】 ${(d.recommend_activity || []).join('、')}`,
            `【情志调节】 ${(d.recommend_emotion || []).join('、')}`,
            `【禁忌】 ${(d.recommend_avoid || []).join('、')}`,
            ``,
            `【经典原文】`,
            d.classic_quote || '-',
            `—— ${d.classic_source || ''}`,
            ``,
            `【白话解读】`,
            d.classic_interpretation || '-'
          ];
          ElementPlus.ElMessageBox.alert(lines.join('\n'), 'L3 养生建议详情', { confirmButtonText: '关闭', customClass: 'report-detail-dialog' });
        }
      } catch (e) {
        ElementPlus.ElMessage.error('加载详情失败: ' + (e.response?.data?.message || e.message));
      }
    }

    async function editAdvice(id) {
      adviceEditDialog.value = true;
      adviceEditLoading.value = true;
      adviceEditTitle.value = '编辑 L3 养生建议 #' + id;
      try {
        const res = await api.get(`/solar-term/advices/${id}`);
        if (res.data.success) {
          const d = res.data.data;
          Object.assign(adviceEditForm, {
            id: d.id, solar_term_index: d.solar_term_index, gua_ge: d.gua_ge,
            element_interaction: d.element_interaction || '', corresponding_organ: d.corresponding_organ || '',
            warning: d.warning || '', classic_quote: d.classic_quote || '',
            classic_source: d.classic_source || '', classic_interpretation: d.classic_interpretation || '',
            status: d.status,
            recommend_food_text: (d.recommend_food || []).join('、'),
            recommend_activity_text: (d.recommend_activity || []).join('、'),
            recommend_emotion_text: (d.recommend_emotion || []).join('、'),
            recommend_avoid_text: (d.recommend_avoid || []).join('、')
          });
        }
      } catch (e) {
        ElementPlus.ElMessage.error('加载详情失败: ' + (e.response?.data?.message || e.message));
      }
      adviceEditLoading.value = false;
    }

    function parseTextInput(text) {
      return text.split(/[、,，\n]/).map(s => s.trim()).filter(Boolean);
    }

    async function saveAdviceEdit() {
      adviceEditSaving.value = true;
      try {
        const payload = {
          warning: adviceEditForm.warning,
          corresponding_organ: adviceEditForm.corresponding_organ,
          element_interaction: adviceEditForm.element_interaction,
          recommend_food: parseTextInput(adviceEditForm.recommend_food_text),
          recommend_activity: parseTextInput(adviceEditForm.recommend_activity_text),
          recommend_emotion: parseTextInput(adviceEditForm.recommend_emotion_text),
          recommend_avoid: parseTextInput(adviceEditForm.recommend_avoid_text),
          classic_quote: adviceEditForm.classic_quote,
          classic_source: adviceEditForm.classic_source,
          classic_interpretation: adviceEditForm.classic_interpretation
        };
        const res = await api.put(`/solar-term/advices/${adviceEditForm.id}`, payload);
        if (res.data.success) {
          // 同步更新审核状态（如果状态有变化）
          await api.put(`/solar-term/advices/${adviceEditForm.id}/status`, { status: adviceEditForm.status });
          ElementPlus.ElMessage.success('保存成功');
          adviceEditDialog.value = false;
          loadAdvices();
          loadSolarTermStats();
        }
      } catch (e) {
        ElementPlus.ElMessage.error('保存失败: ' + (e.response?.data?.message || e.message));
      }
      adviceEditSaving.value = false;
    }

    async function loadSolarTermBasic() {
      solarTermBasicLoading.value = true;
      try {
        const res = await api.get('/solar-term/basic');
        if (res.data.success) {
          solarTermBasicList.value = res.data.data.list || [];
        }
      } catch (e) {
        ElementPlus.ElMessage.error('加载 L1 节气基础失败: ' + (e.response?.data?.message || e.message));
      }
      solarTermBasicLoading.value = false;
    }

    function onSolarTermTabChange(tab) {
      if (tab === 'l1' && solarTermBasicList.value.length === 0) {
        loadSolarTermBasic();
      } else if (tab === 'dist') {
        nextTick(() => renderSolarTermDistChart());
      }
    }

    // App 下载版本
    async function loadAppDownload() {
      appDownloadLoading.value = true;
      try {
        const res = await api.get('/app-download');
        if (res.data.success) {
          const d = res.data.data || {};
          appDownload.url = d.url || '';
          appDownload.version = d.version || '';
          appDownload.enabled = d.enabled !== false;
          appDownload.updated_at = d.updated_at || null;
        }
      } catch (e) {
        ElementPlus.ElMessage.error('加载失败: ' + (e.response?.data?.message || e.message));
      }
      appDownloadLoading.value = false;
    }

    async function saveAppDownload() {
      const url = (appDownload.url || '').trim();
      if (!url) {
        ElementPlus.ElMessage.warning('请填写下载链接');
        return;
      }
      appDownloadSaving.value = true;
      try {
        const res = await api.put('/app-download', {
          url,
          version: (appDownload.version || '').trim(),
          enabled: appDownload.enabled
        });
        if (res.data.success) {
          const d = res.data.data || {};
          appDownload.updated_at = d.updated_at || null;
          ElementPlus.ElMessage.success('下载配置已更新，官网即时生效');
        }
      } catch (e) {
        ElementPlus.ElMessage.error('保存失败: ' + (e.response?.data?.message || e.message));
      }
      appDownloadSaving.value = false;
    }

    function renderSolarTermDistChart() {
      const el = chartSolarTermDist.value;
      if (!el || !solarTermStats.value.byTerm) return;
      const data = solarTermStats.value.byTerm;
      const chart = echarts.init(el);
      chart.setOption({
        tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
        legend: { data: ['已生成', '已审核'], top: 5 },
        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
        xAxis: { type: 'category', data: data.map(d => d.name), axisLabel: { interval: 0, rotate: 30 } },
        yAxis: { type: 'value', name: '条数' },
        series: [
          { name: '已生成', type: 'bar', data: data.map(d => d.gen_count || 0), itemStyle: { color: '#409eff' } },
          { name: '已审核', type: 'bar', data: data.map(d => d.reviewed || 0), itemStyle: { color: '#67c23a' } }
        ]
      });
      chartInstances['solarTermDist'] = chart;
    }

    // Init
    onMounted(() => {
      if (token.value) loadOverview();
      window.addEventListener('resize', () => {
        Object.values(chartInstances).forEach(c => c?.resize());
      });
    });
