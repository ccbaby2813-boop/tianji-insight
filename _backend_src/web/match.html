<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>易缘契合 · 天机推演</title>
<style>
  :root {
    --bg-base: #FFF8F3;
    --bg-elevated: #FFFFFF;
    --text-primary: #3A2E1F;
    --text-secondary: #6B5A45;
    --text-muted: #9B8B75;
    --accent-gold: #C8A55B;
    --accent-gold-border: rgba(200,165,91,0.3);
    --cinnabar: #A83E32;
    --ease-out-expo: cubic-bezier(0.16,1,0.3,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page { width:100%; max-width:460px; margin:0 auto; position:relative; overflow-x:hidden; padding-bottom:100px; }

  /* ===== 主画布 ===== */
  .match-canvas { position:relative; padding:40px 24px 24px; box-sizing:border-box; min-height:100vh; }

  /* 水墨晕染装饰角 */
  .ink-wash { position:absolute; width:140px; height:140px; pointer-events:none; z-index:0; opacity:0.55; }
  .ink-wash-tl {
    top:-30px; left:-40px;
    background: radial-gradient(ellipse at 30% 30%, rgba(168,62,50,0.08) 0%, rgba(139,107,74,0.04) 35%, transparent 65%);
    transform: rotate(-18deg);
  }
  .ink-wash-br {
    bottom:60px; right:-50px;
    background: radial-gradient(ellipse at 70% 70%, rgba(139,107,74,0.08) 0%, rgba(200,165,91,0.03) 40%, transparent 70%);
    transform: rotate(22deg);
  }

  /* ===== 导语 ===== */
  .match-preface { position:relative; z-index:2; text-align:center; margin-bottom:28px; }
  .preface-line { display:block; font-family:"STKaiti","KaiTi",serif; font-size:15px; color:var(--cinnabar); letter-spacing:4px; margin-bottom:6px; }
  .preface-tip { display:block; font-size:11px; color:var(--text-muted); letter-spacing:1px; }

  /* ===== 双卦交辉 ===== */
  .match-hero { position:relative; z-index:2; display:flex; align-items:center; justify-content:center; padding:10px 0 24px; gap:6px; }
  .gua-side { position:relative; flex:1; min-width:0; text-align:center; padding:12px 4px; }
  .gua-glow {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:110px; height:110px; border-radius:50%;
    background: radial-gradient(circle, rgba(200,165,91,0.16) 0%, transparent 65%);
    pointer-events:none; z-index:0; animation:breathe 4s ease-in-out infinite;
  }
  .gua-side-b .gua-glow { animation-delay:2s; }
  @keyframes breathe { 0%,100%{opacity:0.6;} 50%{opacity:1;} }
  .gua-symbol { position:relative; z-index:1; display:block; font-size:44px; color:var(--accent-gold); line-height:1.1; text-shadow:0 0 16px rgba(200,165,91,0.28); font-family:serif; }
  .gua-name { position:relative; z-index:1; display:block; font-family:"STKaiti","KaiTi",serif; font-size:16px; color:var(--text-primary); margin-top:8px; font-weight:700; letter-spacing:2px; word-break:break-word; }
  .gua-ge { position:relative; z-index:1; display:block; font-size:11px; color:var(--text-muted); margin-top:3px; letter-spacing:1px; word-break:break-word; }
  .nickname-chip {
    position:relative; z-index:1; display:inline-flex; align-items:center; justify-content:center;
    margin-top:8px; padding:4px 10px; background:rgba(200,165,91,0.08);
    border:1px solid var(--accent-gold-border); border-radius:14px; max-width:100%;
  }
  .nickname-text { font-size:11px; color:var(--accent-gold); letter-spacing:0.5px; word-break:break-all; }

  /* S 型大波浪曲线连接 */
  .connection-wave { position:relative; width:66px; height:140px; flex-shrink:0; display:flex; align-items:center; justify-content:center; z-index:1; }
  .wave-strand { position:absolute; width:32px; height:130px; pointer-events:none; }
  .wave-strand-1 { left:7px; border-right:1px solid rgba(200,165,91,0.45); border-radius:0 85% 0 85%; animation:waveSway 5s ease-in-out infinite; }
  .wave-strand-2 { right:7px; border-left:1px solid rgba(200,165,91,0.28); border-radius:85% 0 85% 0; animation:waveSway 6s ease-in-out infinite reverse; }
  @keyframes waveSway { 0%,100%{transform:translateY(0) scaleY(1);} 50%{transform:translateY(-4px) scaleY(1.03);} }
  .wave-node {
    position:relative; z-index:2; width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    background:rgba(255,248,243,0.9); border:1px solid var(--accent-gold-border); border-radius:50%;
    box-shadow:0 0 10px rgba(200,165,91,0.12); font-size:16px; color:var(--accent-gold);
  }

  /* 极细金线分隔 */
  .line-gold-thin {
    position:relative; z-index:2; height:1px;
    background:linear-gradient(90deg, transparent 0%, rgba(200,165,91,0.35) 20%, rgba(200,165,91,0.35) 80%, transparent 100%);
    margin:0 8px;
  }

  /* ===== 关系名称 ===== */
  .relation-name {
    position:relative; z-index:2; text-align:center; font-size:32px; font-weight:700; color:var(--cinnabar);
    font-family:"STKaiti","KaiTi",serif; letter-spacing:8px; margin:24px 0 8px;
    text-shadow:0 1px 5px rgba(168,62,50,0.12); line-height:1.3; word-break:break-word;
  }
  .relation-oneliner {
    position:relative; z-index:2; text-align:center; font-family:"STKaiti","KaiTi",serif;
    font-size:13px; color:var(--text-secondary); letter-spacing:1px; margin-bottom:18px; font-style:italic;
    word-break:break-word; line-height:1.6;
  }

  /* 匹配等级印章 */
  .level-seal {
    position:relative; z-index:2; display:flex; align-items:center; justify-content:center;
    width:fit-content; max-width:92%; margin:0 auto 24px; padding:10px 24px;
    background:rgba(200,165,91,0.06); border:1px solid var(--accent-gold-border); border-radius:14px; box-sizing:border-box;
  }
  .level-seal.level-tianzuo { box-shadow:0 0 18px rgba(200,165,91,0.18); }
  .level-seal.level-moqi { box-shadow:0 0 12px rgba(200,165,91,0.12); }
  .level-seal.level-hubu { box-shadow:0 0 8px rgba(200,165,91,0.08); }
  .level-seal-text {
    font-family:"STKaiti","KaiTi",serif; font-size:14px; color:var(--accent-gold);
    letter-spacing:4px; font-weight:700; text-align:center; line-height:1.7; word-break:break-all;
  }

  /* ===== 折叠区（左金线） ===== */
  .fold-section { position:relative; z-index:2; margin:0 0 16px; padding:0 0 0 14px; border-left:1px solid var(--accent-gold-border); }
  .fold-header { display:flex; align-items:center; justify-content:space-between; padding:8px 0; cursor:pointer; }
  .fold-title { font-family:"STKaiti","KaiTi",serif; font-size:13px; color:var(--accent-gold); letter-spacing:3px; font-weight:700; }
  .fold-arrow { font-size:11px; color:var(--accent-gold); transition:transform 0.3s var(--ease-out-expo); }
  .fold-section.open .fold-arrow { transform:rotate(180deg); }
  .fold-body { max-height:0; overflow:hidden; transition:max-height 0.35s var(--ease-out-expo); }
  .fold-section.open .fold-body { max-height:1000px; }
  .fold-text { display:block; font-family:"STKaiti","KaiTi",serif; font-size:13px; color:var(--text-primary); line-height:2; letter-spacing:0.5px; padding-bottom:8px; word-break:break-word; }
  .fold-list-item { display:flex; align-items:flex-start; gap:7px; margin-bottom:6px; }
  .fold-bullet { width:5px; height:5px; border-radius:50%; flex-shrink:0; margin-top:8px; }
  .fold-bullet-gold { background:var(--accent-gold); }
  .fold-bullet-ink { background:var(--text-muted); opacity:0.7; }

  /* ===== 加载/错误状态 ===== */
  .loading-state, .empty-state {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:80vh; color:var(--text-muted); font-size:14px; letter-spacing:2px; text-align:center; padding:0 20px;
  }
  .skeleton-gua { width:80px; height:80px; margin:0 auto 16px; border-radius:50%; background:radial-gradient(circle, rgba(200,165,91,0.12), transparent 65%); border:1px dashed rgba(200,165,91,0.2); animation:breathe 2s ease-in-out infinite; }

  /* ===== 底部操作栏 ===== */
  .match-actions {
    position:fixed; bottom:0; left:0; right:0; display:flex; gap:12px; padding:12px 20px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,248,243,0.92); backdrop-filter:blur(10px); z-index:100;
    box-sizing:border-box; border-top:1px solid rgba(200,165,91,0.18);
  }
  .action-btn {
    flex:1; height:48px; border-radius:999px; font-size:14px; display:flex; align-items:center;
    justify-content:center; gap:6px; border:none; padding:0; margin:0; line-height:1;
    transition:all 0.25s var(--ease-out-expo); cursor:pointer; font-family:"STKaiti","KaiTi",serif; letter-spacing:2px;
  }
  .action-btn:active { transform:scale(0.97); }
  .action-btn-share { background:transparent; border:1px solid var(--accent-gold); color:var(--accent-gold); }
  .action-btn-share:active { background:rgba(200,165,91,0.08); }
  .action-btn-open { background:var(--accent-gold); color:#0A0A1A; box-shadow:0 2px 8px rgba(200,165,91,0.28); font-weight:700; }
  .action-btn-open:active { background:#D4B570; }

  /* 微信引导遮罩 */
  .wechat-mask { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; z-index:200; }
  .wechat-tip { width:86%; max-width:380px; background:var(--bg-elevated); border-radius:12px; padding:24px 20px; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,0.2); border:1px solid rgba(200,165,91,0.2); }
  .wechat-tip-title { font-size:16px; font-weight:600; color:var(--text-primary); margin-bottom:12px; }
  .wechat-tip-body { font-size:13px; line-height:1.8; color:var(--text-secondary); margin-bottom:16px; }
  .wechat-tip-body b { color:var(--accent-gold); }
  .wechat-tip .action-btn { height:40px; font-size:13px; width:100%; }

  .dl-hint { font-size:11px; color:#B05A47; margin-top:6px; display:none; line-height:1.5; text-align:center; width:100%; }

  @media (max-width:360px) {
    .relation-name { font-size:24px; letter-spacing:4px; }
    .gua-symbol { font-size:36px; }
    .gua-name { font-size:14px; }
  }
</style>
</head>
<body>
<!-- 微信环境顶部引导条 -->
<div id="wechatTopBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:9999;background:linear-gradient(135deg,#FFF8F3,#F5EDE0);color:#3A2E1F;padding:12px 16px;font-size:13px;line-height:1.5;box-shadow:0 2px 12px rgba(0,0,0,0.1);border-bottom:1px solid rgba(200,165,91,0.4);">
  <div style="display:flex;align-items:flex-start;gap:8px;">
    <span style="color:#A83E32;font-size:16px;flex-shrink:0;">⤴</span>
    <div>
      <div style="font-weight:600;color:#A83E32;margin-bottom:2px;">微信内无法直接打开 App</div>
      <div style="color:#6B5A45;">请点右上角「···」→「在浏览器打开」，将自动唤起天机推演 App 查看你们的契合关系</div>
    </div>
  </div>
</div>
<div class="page" id="pageMain" style="padding-top:0;">
  <!-- 加载中 -->
  <div class="loading-state" id="loadingState">
    <div class="skeleton-gua"></div>
    <div>正在解读缘分之契…</div>
  </div>

  <!-- 错误 -->
  <div class="empty-state" id="errorState" style="display:none">
    <div id="errorText">这份契合链接已失效或不存在，请让分享方重新生成。</div>
  </div>

  <!-- 主内容 -->
  <div class="match-canvas" id="mainContent" style="display:none">
    <div class="ink-wash ink-wash-tl"></div>
    <div class="ink-wash ink-wash-br"></div>

    <!-- 导语 -->
    <div class="match-preface">
      <span class="preface-line">易 · 缘 · 契 · 合</span>
      <span class="preface-tip" id="prefaceTip">两位有缘人的命格交汇</span>
    </div>

    <!-- 双卦交辉 -->
    <div class="match-hero">
      <div class="gua-side gua-side-a">
        <div class="gua-glow"></div>
        <span class="gua-symbol" id="guaSymbolA">䷀</span>
        <span class="gua-name" id="guaNameA">--</span>
        <span class="gua-ge" id="guaGeA"></span>
        <div class="nickname-chip" id="nicknameChipA">
          <span class="nickname-text" id="nicknameA"></span>
        </div>
      </div>

      <div class="connection-wave">
        <div class="wave-strand wave-strand-1"></div>
        <div class="wave-strand wave-strand-2"></div>
        <div class="wave-node">☯</div>
      </div>

      <div class="gua-side gua-side-b">
        <div class="gua-glow"></div>
        <span class="gua-symbol" id="guaSymbolB">？</span>
        <span class="gua-name" id="guaNameB">你的卦象</span>
        <span class="gua-ge" id="guaGeB"></span>
        <div class="nickname-chip" id="nicknameChipB" style="display:none">
          <span class="nickname-text" id="nicknameB"></span>
        </div>
      </div>
    </div>

    <div class="line-gold-thin"></div>

    <!-- 关系名称 -->
    <div class="relation-name" id="relationName">待解锁</div>
    <div class="relation-oneliner" id="relationOneliner">打开天机推演 App，查看你们之间的相生与契合</div>

    <!-- 匹配等级印章 -->
    <div class="level-seal" id="levelSeal" style="display:none">
      <span class="level-seal-text" id="levelText"></span>
    </div>

    <div class="line-gold-thin"></div>

    <!-- 折叠区：详细分析 -->
    <div class="fold-section" id="analysisSection" style="display:none">
      <div class="fold-header" onclick="toggleFold('analysisSection')">
        <span class="fold-title" id="titleAnalysis">详细分析</span>
        <span class="fold-arrow">▼</span>
      </div>
      <div class="fold-body">
        <span class="fold-text" id="analysisText"></span>
      </div>
    </div>

    <!-- 折叠区：共鸣点 -->
    <div class="fold-section" id="resonanceSection" style="display:none">
      <div class="fold-header" onclick="toggleFold('resonanceSection')">
        <span class="fold-title" id="titleResonance">共鸣点</span>
        <span class="fold-arrow">▼</span>
      </div>
      <div class="fold-body">
        <div id="resonanceList"></div>
      </div>
    </div>

    <!-- 折叠区：冲突点 -->
    <div class="fold-section" id="conflictSection" style="display:none">
      <div class="fold-header" onclick="toggleFold('conflictSection')">
        <span class="fold-title" id="titleConflict">冲突点</span>
        <span class="fold-arrow">▼</span>
      </div>
      <div class="fold-body">
        <div id="conflictList"></div>
      </div>
    </div>

    <!-- 折叠区：建议 -->
    <div class="fold-section" id="adviceSection" style="display:none">
      <div class="fold-header" onclick="toggleFold('adviceSection')">
        <span class="fold-title" id="titleAdvice">建议</span>
        <span class="fold-arrow">▼</span>
      </div>
      <div class="fold-body">
        <span class="fold-text" id="adviceText"></span>
      </div>
    </div>
  </div>

  <!-- 底部操作栏 -->
  <div class="match-actions" id="bottomActions" style="display:none">
    <button class="action-btn action-btn-share" onclick="downloadApp()">下载 App</button>
    <button class="action-btn action-btn-open" onclick="openApp()">打开 App 查看契合</button>
    <div class="dl-hint" id="dlHint">仍未唤醒应用，若已安装请再次点击"打开 App"；否则请先下载安装。</div>
  </div>

  <!-- 微信引导遮罩 -->
  <div class="wechat-mask" id="wechatMask" style="display:none">
    <div class="wechat-tip">
      <div class="wechat-tip-title">微信内无法直接打开 App</div>
      <div class="wechat-tip-body">请点右上角「···」选择<b>「在浏览器打开」</b>，将自动唤起天机推演 App 进入匹配页；或点击下方按钮复制链接，粘贴到手机浏览器打开。</div>
      <button class="action-btn action-btn-share" onclick="copyLink()">复制链接用浏览器打开</button>
    </div>
  </div>
</div>

<script>
var sid = '';
(function(){
  var m = location.search.match(/[?&]sid=([^&]*)/); if(m) sid = decodeURIComponent(m[1]);
  var langM = location.search.match(/[?&]lang=([^&]+)/);
  if(langM && langM[1].toLowerCase()==='en') document.documentElement.lang='en';
})();

var isEn = document.documentElement.lang === 'en';

function isWeChat() { return /MicroMessenger/i.test(navigator.userAgent); }
function toggleFold(id) { document.getElementById(id).classList.toggle('open'); }

function showError(msg) {
  document.getElementById('loadingState').style.display='none';
  document.getElementById('errorState').style.display='flex';
  if(msg) document.getElementById('errorText').textContent=msg;
}

function renderMatch(data) {
  document.getElementById('loadingState').style.display='none';
  document.getElementById('mainContent').style.display='block';
  document.getElementById('bottomActions').style.display='flex';

  // 非微信环境自动唤起 App
  autoOpenApp();
  // 微信环境：数据渲染后弹全屏引导
  maybeShowWechatGuide();

  // 导语
  document.getElementById('prefaceTip').textContent = isEn ? 'The convergence of two destinies' : '两位有缘人的命格交汇';

  // ========== 类型1：匹配结果分享（type='match_result'）—— 完整展示匹配结果 ==========
  if (data.type === 'match_result') {
    // 折叠区标题中英文
    if(isEn) {
      document.getElementById('titleAnalysis').textContent = 'In-depth Analysis';
      document.getElementById('titleResonance').textContent = 'Resonance';
      document.getElementById('titleConflict').textContent = 'Friction';
      document.getElementById('titleAdvice').textContent = 'Advice';
    }
    // A 侧：分享者卦象
    if(data.sharerGuaSymbol) document.getElementById('guaSymbolA').textContent = data.sharerGuaSymbol;
    if(data.sharerGuaName) document.getElementById('guaNameA').textContent = data.sharerGuaName;
    if(data.sharerGuaGe) document.getElementById('guaGeA').textContent = data.sharerGuaGe;
    if(data.sharerNickname) document.getElementById('nicknameA').textContent = data.sharerNickname;
    else document.getElementById('nicknameChipA').style.display='none';

    // B 侧：分享时的对方卦象（完整展示）
    if(data.partnerGuaSymbol) document.getElementById('guaSymbolB').textContent = data.partnerGuaSymbol;
    if(data.partnerGuaName) document.getElementById('guaNameB').textContent = data.partnerGuaName;
    if(data.partnerGuaGe) document.getElementById('guaGeB').textContent = data.partnerGuaGe;

    // 关系名称 + 一句话 + 等级印章
    var rel = data.relation || {};
    if(rel.relationship_name) {
      document.getElementById('relationName').textContent = rel.relationship_name;
      document.getElementById('relationName').style.color = '#A83E32';
    }
    if(rel.one_liner) document.getElementById('relationOneliner').textContent = '「 ' + rel.one_liner + ' 」';
    if(rel.match_level) {
      document.getElementById('levelSeal').style.display='flex';
      document.getElementById('levelText').textContent = rel.match_level;
    }

    // 折叠区：完整填充
    if(rel.analysis) {
      document.getElementById('analysisSection').style.display='block';
      document.getElementById('analysisText').textContent = rel.analysis;
    }
    if(rel.resonance && rel.resonance.length) {
      document.getElementById('resonanceSection').style.display='block';
      var resHtml = '';
      for(var i=0;i<rel.resonance.length;i++) {
        resHtml += '<div class="fold-list-item"><span class="fold-bullet fold-bullet-gold"></span><span class="fold-text">' + rel.resonance[i] + '</span></div>';
      }
      document.getElementById('resonanceList').innerHTML = resHtml;
    }
    if(rel.conflict && rel.conflict.length) {
      document.getElementById('conflictSection').style.display='block';
      var confHtml = '';
      for(var j=0;j<rel.conflict.length;j++) {
        confHtml += '<div class="fold-list-item"><span class="fold-bullet fold-bullet-ink"></span><span class="fold-text">' + rel.conflict[j] + '</span></div>';
      }
      document.getElementById('conflictList').innerHTML = confHtml;
    }
    if(rel.advice) {
      document.getElementById('adviceSection').style.display='block';
      document.getElementById('adviceText').textContent = rel.advice;
    }

    // 折叠区默认展开（打开即看到完整匹配结果）
    ['analysisSection','resonanceSection','conflictSection','adviceSection'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.classList.add('open');
    });

    // 底部按钮文字
    document.querySelector('.action-btn-open').textContent = isEn ? 'Open App' : '打开 App 查看契合';
    document.querySelector('.action-btn-share').textContent = isEn ? 'Download App' : '下载 App';
    return;
  }

  // ========== 类型2：个人人格分享（type='match'）—— 分享者人格 + 引导匹配 ==========
  // 分享者卦象（A 侧）
  if(data.sharerGuaSymbol) {
    document.getElementById('guaSymbolA').textContent = data.sharerGuaSymbol;
  }
  if(data.sharerGuaName) {
    document.getElementById('guaNameA').textContent = data.sharerGuaName;
  } else if(data.sharerGuaId) {
    document.getElementById('guaNameA').textContent = isEn ? 'Hexagram ' + data.sharerGuaId : '第 ' + data.sharerGuaId + ' 卦';
  }
  if(data.sharerNickname) {
    document.getElementById('nicknameA').textContent = data.sharerNickname;
  } else {
    document.getElementById('nicknameChipA').style.display='none';
  }

  // B 侧：接收者卦象（需接收者自己的卦，显示待解锁引导）
  document.getElementById('guaSymbolB').textContent = '？';
  document.getElementById('guaNameB').textContent = isEn ? 'Your Hexagram' : '你的卦象';

  // 关系名称（需接收者自己的卦才能算，显示引导）
  document.getElementById('relationName').textContent = isEn ? 'Unlock in App' : '待解锁';
  document.getElementById('relationOneliner').textContent = isEn ? 'Open Tianji App to reveal the resonance between you two' : '打开天机推演 App，查看你们之间的相生与契合';

  // 底部按钮文字
  document.querySelector('.action-btn-open').textContent = isEn ? 'Open App' : '打开 App 查看契合';
  document.querySelector('.action-btn-share').textContent = isEn ? 'Download App' : '下载 App';
}

function openApp(auto) {
  if(isWeChat()) {
    if(!auto) document.getElementById('wechatMask').style.display='flex';
    return;
  }
  var schemeUrl = 'tianji://match?sid=' + sid;
  var startTime = Date.now();
  var timer = setTimeout(function(){
    if(Date.now()-startTime < 2500) document.getElementById('dlHint').style.display='block';
  }, 2000);
  window.addEventListener('pagehide', function(){ clearTimeout(timer); }, {once:true});
  window.location.href = schemeUrl;
}

// 页面加载后自动唤起（非微信环境）
function autoOpenApp() {
  if(!isWeChat() && sid) {
    setTimeout(function(){ openApp(true); }, 800);
  }
}

// 微信环境检测：页面加载即显示顶部引导条，数据加载后弹全屏引导
(function(){
  if(isWeChat()) {
    document.getElementById('wechatTopBar').style.display = 'block';
    document.getElementById('pageMain').style.paddingTop = '70px';
  }
})();

// 微信环境：数据渲染后自动弹出全屏引导遮罩
function maybeShowWechatGuide() {
  if(isWeChat()) {
    setTimeout(function(){ document.getElementById('wechatMask').style.display='flex'; }, 600);
  }
}

function downloadApp() { window.location.href='https://claw-book.cn'; }

function copyLink() {
  var url = location.href;
  if(navigator.clipboard) {
    navigator.clipboard.writeText(url).then(function(){ alert(isEn?'Link copied':'链接已复制'); }).catch(function(){ fallbackCopy(url); });
  } else { fallbackCopy(url); }
}
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); alert(isEn?'Link copied':'链接已复制'); } catch(e) { alert(isEn?'Copy failed':'复制失败'); }
  document.body.removeChild(ta);
}

async function loadShare() {
  if(!sid) { showError(); return; }
  try {
    var resp = await fetch('/tianji/api/share/resolve/' + sid);
    var json = await resp.json();
    if(json.success && json.data) {
      renderMatch(json.data);
    } else {
      showError();
    }
  } catch(e) {
    console.error('loadShare error:', e);
    showError();
  }
}

loadShare();
