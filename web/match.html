<script>
var STRINGS = {
  loading: '正在解读缘分之契…',
  error: '这份契合链接已失效或不存在，请让分享方重新生成。',
  kicker: '易 · 缘 · 契 · 合',
  desc_pre: 'TA 的命格之卦是',
  desc_mid: '。',
  desc_tail: '打开天机推演 App，解锁你们之间的相生与契合。',
  hint: '* 需已安装并登录天机推演、且完成建档，方可查看双方匹配关系',
  open: '打开 App',
  download: '下载 App',
  copy_link: '复制链接',
  copy_link2: '复制链接用浏览器打开',
  dl_hint: '仍未唤醒应用，若已安装请再次点击"打开 App"；否则请先下载安装。',
  wx_title: '微信内无法直接打开 App',
  wx_body: '请点右上角「···」选择「在浏览器打开」，将自动唤起天机推演 App 进入匹配页；或点击下方按钮复制链接，粘贴到手机浏览器打开。',
  still_loading: '链接解析中…'
};
var STRINGS_EN = {
  loading: 'Decoding the bond…',
  error: 'This match link has expired or is invalid. Please ask the sharer to regenerate it.',
  kicker: 'DESTINED · BOND',
  title_tail: 'wants to share a destined bond with you',
  desc_pre: 'Their life-hexagram is',
  desc_mid: '.',
  desc_tail: 'Open Tianji to reveal the resonance between you two.',
  hint: '* Requires the I Ching Insight app installed & signed in, and a completed profile to view the match',
  open: 'Open App',
  download: 'Download App',
  copy_link: 'Copy Link',
  copy_link2: 'Copy link & open in browser',
  dl_hint: 'Could not wake the app. If installed, tap "Open App" again; otherwise download it first.',
  wx_title: 'Cannot open App inside WeChat',
  wx_body: 'Tap "···" at the top-right and choose "Open in Browser" to auto-launch the Tianji app into the match page; or copy the link below and open it in your phone browser.',
  still_loading: 'Resolving link…'
};

function t() { return i18n === 'en' ? STRINGS_EN : STRINGS; }
function applyLang() {
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var k = el.getAttribute('data-i18n');
    if (k in t()) el.textContent = t()[k];
  });
}
var i18n = 'zh';
function toggleLang() {
  i18n = i18n === 'zh' ? 'en' : 'zh';
  document.getElementById('langBtn').textContent = i18n === 'zh' ? 'EN' : '中文';
  applyLang();
}

function qs(name) {
  var m = location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
  return m ? decodeURIComponent(m[1]) : '';
}

var sid = (qs('sid') || '').replace(/\D/g, '');
var sharerName = '', sharerGua = '', sharerNickname = '';
var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
var isWechat = /MicroMessenger/i.test(navigator.userAgent);
var _autoLaunchDone = false; // 自动唤起只触发一次

function show(id) {
  ['cardLoading', 'cardError', 'cardMain'].forEach(function (c) { document.getElementById(c).style.display = (c === id ? 'block' : 'none'); });
  document.getElementById('btnWrap').style.display = (id === 'cardMain' ? 'flex' : 'none');
}

function resolveShare() {
  if (!sid) { show('cardError'); return; }
  fetch(location.origin + '/tianji/api/share/resolve/' + sid)
    .then(function (r) { return r.json(); })
    .then(function (res) {
      if (res && res.success && res.data && res.data.sharerGuaId) {
        sharerName = res.data.sharerNickname || '';
        sharerGua = res.data.sharerGuaId || '';
        document.getElementById('sharerName').textContent = sharerName || t().still_loading;
        document.getElementById('sharerGua').textContent = '第' + sharerGua + '卦';
        show('cardMain');
        // [SEC-FIX/深链] 页面加载后自动尝试唤起 App：已装 App 用户点击链接即自动拉起，无需再点按钮
        setTimeout(tryAutoLaunch, 600);
      } else {
        show('cardError');
      }
    })
    .catch(function () { show('cardError'); });
}

// 唤起入口：Android 走 scheme，iOS 走 Universal Link；微信内两者均会被拦截，直接给"浏览器打开"引导
function launch(showHint) {
  if (!sid) return;
  var uri = isIOS ? ('https://claw-book.cn/app?sid=' + sid) : ('tianji://match?sid=' + sid);
  // iOS 用 iframe 方式避免未装 App 时 Safari 弹"无法打开"警告；Android 用 location 更可靠
  if (isIOS) {
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = uri;
    document.body.appendChild(iframe);
    setTimeout(function () { if (iframe.parentNode) iframe.parentNode.removeChild(iframe); }, 3000);
  } else {
    location.href = uri;
  }
  if (showHint) {
    setTimeout(function () {
      if (!document.hidden) {
        document.getElementById('dlHint').style.display = 'block';
        if (isWechat) showWechatGuide();
      }
    }, 2500);
  }
}

function showWechatGuide() {
  // 微信内置浏览器内 scheme/Universal Link 均被微信安全策略拦截，无法唤起 App，
  // 显示醒目引导：右上角"···"在浏览器打开，或复制链接用手机浏览器打开
  document.getElementById('copyBtn').style.display = 'block';
  document.getElementById('wechatMask').style.display = 'flex';
}

function copyLink() {
  var url = location.href;
  var done = function () { wxToast('已复制链接，请用手机浏览器打开'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done, function () { fallbackCopy(url, done); });
  } else {
    fallbackCopy(url, done);
  }
}
function fallbackCopy(text, done) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  done();
}
function wxToast(msg) {
  var el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:999;';
  document.body.appendChild(el);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2000);
}

function tryAutoLaunch() {
  if (_autoLaunchDone || !sid) return;
  _autoLaunchDone = true;
  if (isWechat) {
    // 微信内 scheme/Universal Link 均被拦截，无法自动唤起，直接给"浏览器打开"引导
    showWechatGuide();
    return;
  }
  launch(true);
}

function openApp() {
  if (!sid) return;
  // 手动点击：不重复自动尝试，直接唤起 + 未唤起时给提示
  launch(true);
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden) {
    // 回到页面：若之前自动唤起失败（App 未装/未唤起），把"打开 App"按钮保留给用户手动重试
    document.getElementById('dlHint').style.display = 'block';
  }
});
function downloadApp() {
  // 直接跳转 .apk 会被部分浏览器（如腾讯）拦截；改为跳官网首页【下载】板块，由用户自行点击下载
  location.href = location.origin + '/#download';
}

resolveShare();
</script>
