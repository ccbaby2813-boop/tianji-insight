<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex">
<title>OAuth 授权回调</title>
<meta name="description" content="OAuth 授权回调页面，用于完成登录授权。" />
<style>
body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#e8dcc4;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{text-align:center;max-width:600px;padding:40px}
h1{color:#d4af37;font-size:24px;margin-bottom:20px}
.code-box{background:#1a1a1a;border:1px solid #d4af37;border-radius:8px;padding:20px;margin:20px 0;word-break:break-all;font-family:monospace;font-size:14px;line-height:1.6}
button{background:#d4af37;color:#0a0a0a;border:none;padding:12px 24px;border-radius:6px;font-size:16px;cursor:pointer;margin-top:10px}
button:hover{background:#e8c84a}
p{color:#999;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h1>OAuth 授权成功</h1>
<p>请复制下面的授权码，粘贴到对话中：</p>
<div class="code-box" id="codeBox">正在获取授权码...</div>
<button onclick="copyCode()">复制授权码</button>
<p style="margin-top:20px">复制后可以关闭此页面</p>
</div>
<script>
var params = new URLSearchParams(window.location.search);
var code = params.get('code');
var error = params.get('error');
var codeBox = document.getElementById('codeBox');
if (code) {
  codeBox.textContent = code;
} else if (error) {
  codeBox.textContent = '授权失败: ' + error;
  codeBox.style.borderColor = '#ff4444';
} else {
  codeBox.textContent = '未找到授权码，请检查 URL';
}
function copyCode() {
  navigator.clipboard.writeText(codeBox.textContent).then(function() {
    alert('已复制到剪贴板');
  });
}
</script>
</body>
</html>
